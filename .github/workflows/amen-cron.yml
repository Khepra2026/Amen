name: AMEN Cron

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      sync_secrets:
        description: "Synchroniser GitHub → Supabase"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. PING ORCHESTRATOR
  # ============================================================
  ping-orchestrator:
    name: AMEN Cron — Ping Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping AMEN orchestrator
        env:
          AMEN_CRON_TOKEN: ${{ secrets.AMEN_CRON_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          URL="https://4vkv1euabs70myibcbao.helloreaddy.com/functions/v1/amen-cron-fallback"
          response_file="$(mktemp)"

          echo "## AMEN Cron — Orchestrator" >> "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------------------
          # BYPASS CONTRÔLÉ
          # ----------------------------------------------------
          if [ -z "${AMEN_CRON_TOKEN:-}" ]; then
            echo "⚠️ AMEN_CRON_TOKEN absent."
            echo "⚠️ MODE BYPASS — aucun appel authentifié à l'orchestrateur."
            echo "⚠️ Le cron GitHub continue sans considérer cela comme un échec."

            {
              echo "- Status: **BYPASS**"
              echo "- AMEN_CRON_TOKEN: **ABSENT**"
              echo "- Orchestrator ping: **SKIPPED**"
              echo "- Cause: secret GitHub non configuré"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # ----------------------------------------------------
          # APPEL RÉEL
          # ----------------------------------------------------
          echo "AMEN_CRON_TOKEN présent — appel de l'orchestrateur..."

          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --request GET \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "Authorization: Bearer ${AMEN_CRON_TOKEN}" \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$URL"
          )"

          echo "HTTP STATUS: $http_code"

          echo "RESPONSE:"
          cat "$response_file"

          {
            echo "- Status: **HTTP $http_code**"
            echo "- AMEN_CRON_TOKEN: **PRESENT**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "❌ AMEN Cron — orchestrator returned HTTP $http_code"
            echo "- Orchestrator: **FAILED**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ AMEN Cron — orchestrator responded successfully."
          echo "- Orchestrator: **SUCCESS**" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 2. INVENTORY — INDÉPENDANT DU PING
  # ============================================================
  inventory:
    name: AMEN Cron — Secrets Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inventaire des secrets GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          echo "## GitHub Secrets Inventory" >> "$GITHUB_STEP_SUMMARY"

          if gh secret list \
            --repo "${{ github.repository }}" \
            > /tmp/github_secrets.txt 2>/tmp/github_secrets_error.txt
          then

            echo "Inventaire GitHub disponible."

            awk '{print "- ✅ " $1}' \
              /tmp/github_secrets.txt \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "⚠️ Impossible de lire les secrets GitHub."
            echo "- Status: **UNAVAILABLE**" >> "$GITHUB_STEP_SUMMARY"

            cat /tmp/github_secrets_error.txt || true
          fi


      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest


      - name: Inventaire des secrets Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: 4vkv1euabs70myibcbao
        shell: bash
        run: |
          set -uo pipefail

          echo "## Supabase Secrets Inventory" >> "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------------------
          # BYPASS SI ACCESS TOKEN ABSENT
          # ----------------------------------------------------
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then

            echo "⚠️ SUPABASE_ACCESS_TOKEN absent."
            echo "⚠️ Inventaire Supabase ignoré."

            {
              echo "- Status: **BYPASS**"
              echo "- SUPABASE_ACCESS_TOKEN: **ABSENT**"
              echo "- Supabase secrets inventory: **SKIPPED**"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # ----------------------------------------------------
          # INVENTAIRE RÉEL
          # ----------------------------------------------------
          if supabase secrets list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            > /tmp/supabase_secrets.txt 2>/tmp/supabase_secrets_error.txt
          then

            echo "Inventaire Supabase disponible."

            cat /tmp/supabase_secrets.txt \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Status: **SUCCESS**" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "⚠️ Impossible de lister les secrets Supabase."

            {
              echo "- Status: **UNAVAILABLE**"
              echo "- Cause: SUPABASE_ACCESS_TOKEN invalide ou accès insuffisant"
            } >> "$GITHUB_STEP_SUMMARY"

            cat /tmp/supabase_secrets_error.txt || true

            # BYPASS : ne pas faire échouer le cron horaire
            exit 0
          fi


  # ============================================================
  # 3. SYNC MANUELLE — STRICTE
  # ============================================================
  sync-github-to-supabase:
    name: AMEN Cron — Sync Secret

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest


      # --------------------------------------------------------
      # VALIDATION STRICTE
      # --------------------------------------------------------
      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AMEN_CRON_TOKEN: ${{ secrets.AMEN_CRON_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "## Manual Secret Synchronization" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${AMEN_CRON_TOKEN:-}" ]; then
            echo "❌ AMEN_CRON_TOKEN absent."
            echo "❌ Synchronisation manuelle impossible."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN absent."
            echo "❌ Synchronisation manuelle impossible."
            exit 1
          fi

          echo "✅ Required secrets detected."
          echo "- Validation: **PASS**" >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------------
      # SYNC
      # --------------------------------------------------------
      - name: Sync AMEN_CRON_TOKEN → Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: 4vkv1euabs70myibcbao
          AMEN_CRON_TOKEN: ${{ secrets.AMEN_CRON_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Synchronisation de AMEN_CRON_TOKEN vers Supabase..."

          supabase secrets set \
            AMEN_CRON_TOKEN="$AMEN_CRON_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_REF"

          echo "✅ AMEN_CRON_TOKEN synchronisé."

          echo "- Secret synchronization: **SUCCESS**" \
            >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------------
      # REDEPLOY
      # --------------------------------------------------------
      - name: Redeploy amen-cron-fallback
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: 4vkv1euabs70myibcbao
        shell: bash
        run: |
          set -euo pipefail

          echo "Redéploiement de amen-cron-fallback..."

          supabase functions deploy \
            amen-cron-fallback \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

          echo "✅ Function amen-cron-fallback redéployée."

          echo "- Function redeploy: **SUCCESS**" \
            >> "$GITHUB_STEP_SUMMARY"
