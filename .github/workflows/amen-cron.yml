name: AMEN Cron

on:
  schedule:
    - cron: "0 * * * *" # toutes les heures
  workflow_dispatch:

jobs:
  ping-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping AMEN orchestrator
        shell: bash
        env:
          AMEN_CRON_TOKEN: ${{ secrets.AMEN_CRON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${AMEN_CRON_TOKEN:-}" ]; then
            echo "❌ Secret AMEN_CRON_TOKEN manquant"
            exit 1
          fi

          URL="https://4vkv1euabs70myibcbao.helloreaddy.com/functions/v1/amen-cron-fallback"
          response_file="$(mktemp)"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --request GET \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "Authorization: Bearer ${AMEN_CRON_TOKEN}" \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$URL"
          )"

          echo "HTTP STATUS: $http_code"
          echo "RESPONSE:"
          cat "$response_file"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "❌ AMEN orchestrator returned HTTP $http_code"
            exit 1
          fi

          echo "✅ AMEN orchestrator responded successfully."
