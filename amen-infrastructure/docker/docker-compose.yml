services:
  amen-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://amen:amen@postgres:5432/amen
      - OLLAMA_URL=http://ollama:11434

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amen
      POSTGRES_PASSWORD: amen
      POSTGRES_DB: amen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amen"]
      interval: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6336:6333"
      - "6337:6334"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
