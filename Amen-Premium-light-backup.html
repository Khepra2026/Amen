<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMEN - Local-First Sovereign Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --amen-black: #0A0A0B;
      --amen-surface: #111113;
      --amen-gold: #C9A86A;
      --amen-border: #222226;
      --amen-text: #EDEDEF;
      --amen-text-muted: #98989F;
    }
    body { background-color: var(--amen-black); color: var(--amen-text); font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function AmenApp() {
      const [query, setQuery] = React.useState("Comparer lumière hermétisme / Vedanta");
      const [results, setResults] = React.useState(false);

      const handleSearch = (e) => {
        e.preventDefault();
        setResults(true);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#0A0A0B] text-[#EDEDEF]">
          {/* Header */}
          <header className="border-b border-[#222226] px-6 py-4 flex justify-between items-center bg-[#111113]">
            <div className="flex items-center gap-3">
              <span className="text-xl font-bold tracking-widest text-white">AMEN</span>
            </div>
            <div className="text-xs px-3 py-1 rounded bg-[#222226] text-[#C9A86A] font-medium tracking-wider">
              LOCAL-FIRST • SOUVERAIN
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-4xl w-full mx-auto p-6 md:p-10">
            <div className="mb-8">
              <h1 className="text-2xl md:text-3xl font-semibold mb-2">Recherche AMEN</h1>
              <p className="text-sm text-[#98989F]">Interrogez votre base de connaissances souveraine en local.</p>
            </div>

            <form onSubmit={handleSearch} className="flex flex-col md:flex-row gap-3 mb-8">
              <input 
                type="text" 
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                className="flex-1 bg-[#111113] border border-[#222226] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C9A86A] transition"
                placeholder="Entrez votre requête..."
              />
              <button 
                type="submit"
                className="bg-[#C9A86A] text-black font-semibold px-6 py-3 rounded-xl hover:opacity-95 transition"
              >
                Interroger
              </button>
            </form>

            {results && (
              <div className="space-y-4 animate-fadeIn">
                <div className="p-5 rounded-xl bg-[#111113] border border-[#222226]">
                  <div className="text-xs text-[#C9A86A] mb-1 font-semibold uppercase tracking-wider">Résultat synthétique</div>
                  <h3 className="text-lg font-medium text-white mb-2">Analyse croisée : Hermétisme & Vedanta</h3>
                  <p className="text-sm text-[#98989F] leading-relaxed">
                    L'approche hermétique aborde la lumière comme l'Émanation primordiale et le principe de correspondance universelle, tandis que le Vedanta (notamment à travers le Jyotish ou la lumière de la Conscience pure - <em>Atman-Brahman</em>) identifie la lumière ultime à la conscience non-duelle elle-même.
                  </p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AmenApp />);
  </script>
</body>
</html>
